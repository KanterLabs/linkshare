name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Test Go service
        run: |
          go vet ./...
          go test ./...

      - name: Validate scripts
        run: |
          node --check web/assets/app.js
          node --check web/assets/guide.js
          bash -n deploy/provision-lxc.sh deploy/pve-install.sh
          python3 -m py_compile skills/linkshare/scripts/linkshare.py

      - name: Build static artifact
        run: docker build --platform linux/amd64 --target artifact .
